[project]
name = "sblex-server"
version = "0.4.1-dev1"
description = "Saldo-WS-server && Dalin-WS-server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Språkbanken Text", email = "sb-info@svenska.gu.se" },
]
dependencies = [
  "asgi-matomo>=0.6.2",
  "brotli-asgi>=1.4.0",
  "environs>=14.6.0",
  "fastapi>=0.115.2",
  "httpx>=0.27.2",
  "jinja2>=3.1.4",
  "json-arrays>=0.15.0",
  "opentelemetry-exporter-otlp>=1.27.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
  "opentelemetry-instrumentation-logging>=0.48b0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-semantic-conventions>=0.60b0",
  "orjson>=3.10.7",
  "pydantic-settings>=2.5.2",
  "sblex-fjall-morphology>=0.1.2",
  "typer>=0.25.0",
  "uvicorn>=0.32.0",
]

[project.scripts]
saldo-ws = "sblex.saldo_ws.cli:app"

[dependency-groups]
dev = [
  "asgi-lifespan>=2.1.0",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.9",
  "syrupy>=4.7.2",
  "ty>=0.0.32",
  "uvicorn>=0.32.0",
  "watchfiles>=0.24.0",
]

[build-system]
requires = ["uv_build>=0.9.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sblex"
namespace = true
source-exclude = ["/.github", "/docs"]
